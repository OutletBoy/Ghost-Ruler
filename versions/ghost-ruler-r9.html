<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120e33">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ghost Ruler r9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* Ghost Ruler phone UI. Night-purple glass panels, chunky toy-like buttons, one accent per ghost. */
:root {
  --ink: #241a3f; --panel: rgba(36, 26, 70, .78); --panel2: rgba(58, 44, 104, .9); --line: rgba(255, 255, 255, .14);
  --text: #fbf7ff; --muted: #bfb4e6; --gold: #ffd166; --good: #7fe0a0; --bad: #ff6b6b; --violet: #b79cff;
  --r: 18px; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --font: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #120e33; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--font); color: var(--text); -webkit-user-select: none; user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
.hidden { display: none !important; }
.ic { display: inline-flex; width: 1em; height: 1em; }
.ic svg { width: 100%; height: 100%; }
.ic.gold { color: var(--gold); }

/* ---------- shared buttons ---------- */
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1.5px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 3px 0 rgba(0,0,0,.35); font-size: 20px; transition: transform .12s; }
.round:active { transform: translateY(2px) scale(.96); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.round.small { width: 40px; height: 40px; font-size: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 16px; font-size: 18px; font-weight: 600;
  background: linear-gradient(#ffe08a, #ffbf3f); color: #4a2a00; box-shadow: 0 4px 0 #b9741a, 0 8px 18px rgba(0,0,0,.35); transition: transform .1s, box-shadow .1s; }
.btn .ic { font-size: 20px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9741a, 0 4px 10px rgba(0,0,0,.3); }
.btn.soft { background: var(--panel2); color: var(--text); box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.btn.big { min-height: 60px; font-size: 21px; padding: 0 30px; }
.link { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; font-size: 16px; padding: 12px; }
.x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); font-size: 16px; flex: none; }

/* ---------- HUD ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--safe-t) + 10px) 12px 0; pointer-events: none; transition: opacity .3s; }
.hud .row { display: flex; align-items: center; gap: 8px; }
.hud .row > * { pointer-events: auto; }
.pill { height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 20px; background: var(--panel); border: 1.5px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 18px; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.pill .lbl { color: var(--muted); font-size: 14px; }
.pill.turn { margin-right: auto; }
.pill.glow .ic { font-size: 20px; filter: drop-shadow(0 0 6px rgba(255, 209, 102, .7)); }
.pill.glow .pips { display: flex; gap: 3px; margin-left: 2px; }
.pill.glow .pips i { width: 6px; height: 14px; border-radius: 3px; background: rgba(255,255,255,.15); }
.pill.glow .pips i.on { background: var(--gold); box-shadow: 0 0 6px rgba(255,209,102,.8); }
  border: 1.5px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.12); } }
@keyframes throb { 50% { filter: brightness(1.4); } }

/* ---------- camera buttons ---------- */
.cam { position: absolute; right: 10px; top: calc(var(--safe-t) + 104px); display: flex; flex-direction: column; gap: 8px; }
.cam .eye.on { background: rgba(255, 107, 90, .35); border-color: rgba(255,140,120,.7); }

/* ---------- tray ---------- */
.tray { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 10px calc(var(--safe-b) + 10px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; transition: transform .3s, opacity .3s; }
.tray > * { pointer-events: auto; }
.tray.busy .actions, .tray.busy .endwrap { opacity: .35; pointer-events: none; }
.ctx { display: none; align-items: center; gap: 8px; padding: 8px; border-radius: var(--r); background: var(--panel2); border: 1.5px solid var(--line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: rise .2s; }
.ctx.show { display: flex; }
.ctx .hint { flex: 1; display: flex; align-items: center; gap: 8px; padding-left: 6px; font-size: 16px; color: var(--muted); }
.ctx .hint .ic { color: #ffb347; font-size: 20px; }
.chips { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; display: grid; grid-template-columns: 34px auto; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 4px 10px 4px 4px; border-radius: 14px; background: rgba(0,0,0,.25); }
.chip img { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.12); }
.chip b { font-size: 18px; line-height: 1; color: #ffb8d0; }
.chip em { font-style: normal; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 6px; justify-self: start; }
.chip em.weak { background: #ff5d7a; color: #fff; } .chip em.res { background: #5b5480; } .chip em.unk { background: #5b5480; } .chip em.panic { background: var(--gold); color: #4a2a00; }
.chip .nm { font-size: 11px; color: var(--muted); }
.chip.hunter b { color: var(--gold); font-size: 15px; }
.chip.empty { grid-template-columns: auto; padding: 8px 12px; }
.go { flex: none; display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 16px; border-radius: 14px; font-weight: 600; font-size: 16px;
  background: linear-gradient(#ffe08a, #ffbf3f); color: #4a2a00; box-shadow: 0 3px 0 #b9741a; animation: pulse 1.2s infinite; }
.go .ic { font-size: 20px; }
@keyframes pulse { 50% { box-shadow: 0 3px 0 #b9741a, 0 0 0 6px rgba(255,209,102,.25); } }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }

.actions { display: flex; justify-content: center; gap: 6px; min-height: 76px; }
.act { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .12s; }
.act .disc { position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; color: var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff 0, var(--c) 55%); border: 2.5px solid var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.45); }
.act > span:not(.ic) { font-size: 11.5px; line-height: 1.1; text-align: center; color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,.6); max-width: 64px; }
.act:active { transform: translateY(2px) scale(.95); }
.act.active .disc { box-shadow: 0 0 0 4px #fff, 0 0 18px var(--c); transform: translateY(-3px); }
.act.off { opacity: .4; filter: saturate(.3); }
.act .badge { position: absolute; top: -4px; right: -6px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--ink); color: #fff; font-size: 12px; display: grid; place-items: center; border: 2px solid var(--c); }
.act .usedMark { position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--good); color: var(--ink); font-size: 12px; font-style: normal; display: grid; place-items: center; }
.setupHint { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 18px; border-radius: var(--r); background: var(--panel); text-align: center; }
.setupHint b { font-size: 18px; } .setupHint span:not(.ic) { color: var(--muted); font-size: 14px; }

.bottom { display: flex; align-items: flex-end; gap: 8px; }
.cards { flex: 1; display: flex; gap: 6px; min-width: 0; }
.card { position: relative; flex: 1; max-width: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 7px; border-radius: 16px;
  background: var(--panel); border: 2px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: transform .15s, border-color .15s; }
.card.sel { border-color: var(--c); transform: translateY(-6px); box-shadow: 0 0 0 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.4), 0 0 16px color-mix(in srgb, var(--c) 60%, transparent); }
.card .face { position: relative; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 55%, #fff), var(--c)); border: 2px solid var(--ink); overflow: visible; }
.card .face img { width: 100%; height: 100%; border-radius: 50%; }
.card .type { position: absolute; right: -6px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: var(--ink); border: 2px solid var(--ink); }
.card .nm { font-size: 13px; font-weight: 600; }
.card .wisps { display: flex; gap: 3px; }
.card .wisps i { width: 9px; height: 11px; border-radius: 50% 50% 45% 45%; background: rgba(255,255,255,.18); }
.card .wisps i.on { background: #c6f2ff; box-shadow: 0 0 5px rgba(160,230,255,.8); }
.card.acted .face { filter: saturate(.5) brightness(.85); }
.card.isout .face { filter: grayscale(1) brightness(.6); }
.card .out { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 2px 7px; border-radius: 10px; background: var(--ink); font-size: 14px; color: #ffb3b3; }
.card .done { position: absolute; top: 4px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--good); color: var(--ink); font-size: 11px; display: grid; place-items: center; }
.endwrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.endbtn { display: flex; align-items: center; gap: 6px; height: 54px; padding: 0 14px 0 16px; border-radius: 16px; font-weight: 600; font-size: 16px; white-space: nowrap;
  background: linear-gradient(#ff8fa8, #ff5d7a); color: #fff; box-shadow: 0 4px 0 #a52c48, 0 8px 18px rgba(0,0,0,.35); }
.endbtn.ready { background: linear-gradient(#9ff0b8, #4fd182); color: #10381f; box-shadow: 0 4px 0 #2a8a4f; }
.endbtn .ic { font-size: 20px; }
.endbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a52c48; }

/* ---------- inspect ---------- */
.inspect { position: absolute; left: 10px; right: 10px; bottom: calc(var(--safe-b) + 196px); display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r);
  background: var(--panel2); border: 1.5px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: rise .2s; }
.inspect img.big { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.1); flex: none; }
.inspect .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.inspect .title { display: flex; align-items: center; gap: 8px; } .inspect .title b { font-size: 18px; }
.inspect .state { font-size: 12px; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,.12); }
.inspect .state.uneasy { background: #7d6a2a; } .inspect .state.scared { background: #a4553a; } .inspect .state.panic { background: var(--bad); }
.nerve { display: flex; gap: 2px; }
.nerve i { flex: 1; height: 10px; border-radius: 3px; background: rgba(255,255,255,.14); max-width: 18px; }
.nerve i.on { background: linear-gradient(#a6f1c0, #4fd182); }
.nerve i.line { margin-right: 4px; }
.nerve.hunterN i.on { background: linear-gradient(#ffe08a, #ffb347); }
.inspect .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.inspect .meta .type { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); font-size: 13px; }
.inspect .meta .unk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #5b5480; color: #fff; }
.inspect .next { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }

/* ---------- popups ---------- */
.pops, .banners { position: absolute; inset: 0; pointer-events: none; }
.pop { position: absolute; transform: translate(-50%, -100%); animation: popup 1.4s ease-out forwards; }
.pop.big { z-index: 2; }
@keyframes popup { 0% { transform: translate(-50%, -60%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -110%) scale(1.15); opacity: 1; }
  30% { transform: translate(-50%, -105%) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -190%); opacity: 0; } }
.dmg { display: flex; align-items: center; gap: 4px; font-size: 30px; font-weight: 700; color: var(--c);
  -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
.pop.big .dmg { font-size: 38px; }
.dmg em { font-style: normal; font-size: 16px; padding: 2px 8px; border-radius: 10px; background: #ff5d7a; color: #fff; -webkit-text-stroke: 0; text-shadow: none; }
.dmg .ic { font-size: 22px; }
.tag { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 12px; font-size: 15px; font-weight: 600; border: 2px solid var(--ink); white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
.tag.red { background: #ff5d7a; } .tag.amber { background: #ffb347; color: var(--ink); } .tag.green { background: #4fd182; color: var(--ink); }
.tag.blue { background: #7fd6ff; color: var(--ink); } .tag.grey { background: #8e86b5; } .tag.gold { background: var(--gold); color: var(--ink); }
.fly { position: absolute; font-size: 26px; animation: fly .85s cubic-bezier(.5,0,.8,.4) forwards; filter: drop-shadow(0 0 8px rgba(255,209,102,.9)); }
@keyframes fly { 0% { transform: translate(-50%,-50%) scale(.6); } 20% { transform: translate(-50%,-80%) scale(1.3); } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.6); opacity: .6; } }
.banners { display: grid; place-items: center; }
.banner { grid-area: 1 / 1; padding: 14px 34px; border-radius: 22px; font-size: 28px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #7b5cff, #b14bff);
  border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 14px 40px rgba(0,0,0,.45); animation: bannerIn .35s cubic-bezier(.3,1.6,.5,1); }
.banner.house { background: linear-gradient(135deg, #3a3466, #5b4f96); }
.banner.hunter { background: linear-gradient(135deg, #ffb347, #ff7a3c); color: var(--ink); }
.banner.bad { background: linear-gradient(135deg, #ff6b6b, #d23a5a); } .banner.good { background: linear-gradient(135deg, #5fe0a0, #24b37a); color: #0d2f1c; }
.banner.out { animation: bannerOut .26s forwards; }
@keyframes bannerIn { from { transform: scale(.3) rotate(-6deg); opacity: 0; } }
@keyframes bannerOut { to { transform: scale(1.2); opacity: 0; } }
.toast { position: absolute; left: 50%; top: calc(var(--safe-t) + 100px); transform: translate(-50%, -20px); padding: 10px 18px; border-radius: 14px; background: var(--ink); opacity: 0; transition: .2s; pointer-events: none; font-size: 15px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- modals and sheets ---------- */
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(14, 10, 40, .55); animation: fade .2s; padding: 20px; z-index: 10; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(340px, 100%); padding: 22px 18px 18px; border-radius: 22px; background: var(--panel2); border: 2px solid var(--line); text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: rise .25s; }
.dialog p { margin: 0 0 18px; font-size: 19px; }
.dialog .btns { display: flex; gap: 10px; } .dialog .btns .btn { flex: 1; padding: 0 10px; font-size: 16px; }
.clashM { align-items: end; padding: 0; }
.sheet { width: 100%; padding: 16px 16px calc(var(--safe-b) + 16px); border-radius: 26px 26px 0 0; background: linear-gradient(#3b2d72, #2a1f55); border-top: 2px solid var(--line); box-shadow: 0 -10px 40px rgba(0,0,0,.5); animation: sheetUp .3s cubic-bezier(.2,1.2,.4,1); }
@keyframes sheetUp { from { transform: translateY(100%); } }
.clash .head { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
.clash .head b { font-size: 28px; color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.clash .head span:not(.ic) { color: var(--muted); font-size: 15px; }
.vs { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 6px 0; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; max-width: 170px; }
.vs .nm { font-weight: 600; } .vs .v { font-size: 22px; font-weight: 700; color: var(--muted); }
.dwrap { width: 100%; aspect-ratio: 1; }
.disc { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 0 rgba(0,0,0,.4)); }
.disc .rot { transform-origin: 0 0; }
.disc text.sl { font: 700 10px var(--font); fill: var(--ink); }
.disc text.sl.M { fill: #bfb4e6; }
.legend { display: flex; justify-content: center; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
.legend span:not(.ic) { display: inline-flex; align-items: center; gap: 4px; } .legend i { width: 10px; height: 10px; border-radius: 3px; }
.opts { display: flex; gap: 8px; }
.opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 16px; background: rgba(0,0,0,.25); border: 2px solid transparent; }
.opt b { font-size: 17px; } .opt .sub { font-size: 11px; color: var(--muted); text-align: center; } .opt .pct { font-size: 22px; font-weight: 700; color: var(--good); }
.opt.on { border-color: var(--gold); background: rgba(255,209,102,.12); }
.opt.off { opacity: .4; }
.clash .btns { display: flex; justify-content: center; margin-top: 12px; } .clash .btns .btn { width: 100%; }
.clash.spinning .opts, .spinning .clash .opts, .spinning .clash .btns, .spinning .legend { opacity: .3; pointer-events: none; }
.result { margin-top: 10px; text-align: center; font-size: 24px; font-weight: 700; animation: bannerIn .3s; }
.result.rw { color: var(--good); } .result.rl { color: var(--bad); } .result.re { color: var(--muted); }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(var(--safe-t) + 20px) 24px calc(var(--safe-b) + 24px);
  background: radial-gradient(ellipse at 50% 30%, rgba(94, 58, 134, .62), rgba(18, 14, 51, .96) 70%); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .3s; text-align: center; }
.screen.in { opacity: 1; }
.screen h1 { margin: 0; font-size: 40px; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); }
.screen h2 { margin: 0; font-size: 30px; }
.logo { display: flex; flex-direction: column; line-height: .9; font-weight: 700; transform: rotate(-4deg); }
.logo span { font-size: 64px; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); }
.logo .g { color: #efe6ff; } .logo .r { color: var(--gold); font-size: 72px; margin-left: 40px; }
.house { display: flex; flex-direction: column; } .house small { color: var(--muted); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; } .house b { font-size: 22px; }
.team { display: flex; gap: 10px; }
.tm { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: hop .5s var(--d) both cubic-bezier(.3,1.6,.5,1); }
.tm img { width: 88px; height: 88px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 50%, #fff), var(--c)); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
.tm span:not(.ic) { font-weight: 600; }
@keyframes hop { from { transform: translateY(30px) scale(.6); opacity: 0; } }
.rules { display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); text-align: left; }
.rule { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--panel); }
.rule .ri { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--violet); color: var(--ink); font-size: 22px; border: 2px solid var(--ink); }
.rule b { font-size: 16px; } .rule p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.stars { display: flex; flex-direction: column; gap: 8px; width: min(340px, 100%); }
.star { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px; background: var(--panel); color: var(--muted); }
.star .ic { font-size: 32px; color: #4a4270; }
.star.on { color: var(--text); } .star.on .ic { color: var(--gold); animation: starIn .45s var(--d) both cubic-bezier(.3,1.8,.5,1); filter: drop-shadow(0 0 8px rgba(255,209,102,.8)); }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
.why { color: var(--muted); font-size: 17px; margin: 0; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; } .stats span:not(.ic) { padding: 6px 12px; border-radius: 12px; background: var(--panel); font-size: 14px; color: var(--muted); }
.screen.won h1 { color: var(--gold); } .screen.lost h1 { color: #ffb3c1; }

@media (min-width: 700px) { .tray { left: 50%; right: auto; width: 520px; transform: translateX(-50%); } .inspect { left: 50%; right: auto; width: 500px; transform: translateX(-50%); } }
@media (max-height: 700px) { .act .disc { width: 46px; height: 46px; font-size: 22px; } .actions { min-height: 66px; } .card .face { width: 42px; height: 42px; } }

/* screen-check mode: no motion so the black and white shots line up */
.shot *, .shot *::before, .shot *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
.shot .go { animation: none !important; }
.screen.nogl { opacity: 1; } .screen.nogl p { max-width: 300px; color: var(--muted); font-size: 17px; line-height: 1.4; margin: 0; }
.btn.soft.warn { background: #ff6b7d; color: #2a0b14; }
.chip .row { display: flex; align-items: center; gap: 5px; }

/* pause: sound controls */
.sound { width: min(320px, 100%); display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--panel); box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); }
.vol { display: grid; grid-template-columns: 64px 1fr 44px; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
.vol b { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted, #b9b0d6); font-size: 14px; }
.vol input { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; width: 100%; }
.vol input::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: var(--panel2); }
.vol input::-moz-range-track { height: 8px; border-radius: 4px; background: var(--panel2); }
.vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: #c7a6ff; border: 3px solid var(--ink); }
.vol input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #c7a6ff; border: 3px solid var(--ink); }
.btn.mute { align-self: center; min-height: 44px; }
.btn.mute.off { opacity: .8; }

/* ---------- what a move does, shown when you pick it ---------- */
.explain { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); background: var(--panel2); border: 1.5px solid var(--line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: rise .18s; }
.explain .ei { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; color: var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff 0, var(--c) 60%); border: 2px solid var(--ink); }
.explain b { font-size: 16px; } .explain p { margin: 2px 0 0; font-size: 14px; line-height: 1.3; color: var(--muted); }

/* ---------- the goal, always on screen ---------- */
.goal { margin-top: 8px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 17px; background: var(--panel);
  border: 1.5px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: max-content; max-width: 100%; pointer-events: auto; }
.goal .ic { color: var(--gold); font-size: 18px; } .goal .gt { font-size: 14px; font-weight: 600; }
.goal .faces { display: flex; gap: 3px; } .goal .faces span { position: relative; width: 24px; height: 24px; border-radius: 50%; background: #3b2f66; border: 1.5px solid var(--line); overflow: hidden; }
.goal .faces img { width: 100%; height: 100%; object-fit: cover; }
.goal .faces span.out { border-color: var(--good); } .goal .faces span.out::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; background: rgba(79, 209, 130, .72); color: var(--ink); font-size: 14px; font-weight: 700; }
.goal .n { font-size: 13px; color: var(--muted); white-space: nowrap; }
.goal.bump { animation: bump .45s; }

/* ---------- the guide ---------- */
.coach { position: absolute; left: 10px; right: 10px; top: calc(var(--safe-t) + 142px); z-index: 30; display: flex; gap: 10px; align-items: flex-start; padding: 12px;
  border-radius: var(--r); background: rgba(255, 250, 240, .97); color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 0 5px 0 var(--ink), 0 10px 24px rgba(0,0,0,.35);
  animation: rise .22s; max-width: 520px; margin: 0 auto; }
.coach img { flex: none; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #e8e2ff); border: 2px solid var(--ink); }
.coach .ct { flex: 1; } .coach p { margin: 0 0 8px; font-size: 16px; line-height: 1.32; }
.coach .cb { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.coach .cb .skip { color: #6b5fa0; font-size: 14px; padding: 8px; margin-right: auto; }
.coach .cb .nx { padding: 8px 16px; border-radius: 12px; background: linear-gradient(#ffe08a, #ffbf3f); color: #4a2a00; font-weight: 600; box-shadow: 0 3px 0 #b9741a; }
.coach .dots { font-size: 12px; color: #8b80b8; }
.coach.tip { top: calc(var(--safe-t) + 142px); background: rgba(36, 26, 70, .95); color: var(--text); border-color: var(--gold); box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.coach.tip p { margin: 0; font-size: 15px; } .coach.tip img { width: 40px; height: 40px; }
.coach.tip .tx { color: var(--muted); font-size: 20px; padding: 2px 4px; }
.coachOn { position: relative; z-index: 25; animation: glowpulse 1.1s ease-in-out infinite; }
@keyframes glowpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 209, 102, .0); } 50% { box-shadow: 0 0 0 5px rgba(255, 209, 102, .85); } }
.goalLine { margin: 0 auto; max-width: 300px; text-align: center; font-size: 16px; line-height: 1.35; color: var(--muted); }

/* ---------- r7 ---------- */
/* who comes next from the van */
.hud .next { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 8px; border-radius: 15px; background: var(--panel); border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; pointer-events: auto; }
.hud .next img { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.12); border: 1.5px solid var(--ink); }
.hud .next .vanic { color: #ffb347; font-size: 17px; }
.hud .next.soon { border-color: #ff7a3c; color: #ffd0a8; animation: throb 1.2s infinite; }
.hud .next.full { color: var(--muted); }
.hud .next.bump { animation: bump .45s; }
/* the clock: the other way to win */
.goal .heart { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 12px; color: #ffb8e0; background: rgba(255,122,200,.12); white-space: nowrap; }
.goal .heart .ic { color: #ff7ac8; font-size: 15px; }
.goal .heart.on { background: #ff7ac8; color: var(--ink); animation: glowpulse 1s infinite; }
.goal .heart.on .ic { color: var(--ink); }
/* ghost card: steps left and whether the attack is used */
.card .steps { position: absolute; top: 4px; right: 4px; display: flex; align-items: center; gap: 2px; padding: 1px 5px; border-radius: 8px; background: var(--ink); font-size: 11px; color: #c6f2ff; }
.card .steps b { font-size: 12px; }
.card.acted .steps span { color: var(--good); }
/* inspect card extras */
.inspect .trait { font-size: 12px; color: #d7cdfa; background: rgba(155,123,255,.16); padding: 3px 8px; border-radius: 8px; align-self: flex-start; }
.setupHint .bonus { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; color: var(--gold) !important; font-weight: 600; }
/* attack preview chips */
.chip .row { display: flex; align-items: center; gap: 4px; }
.chip em.combo { background: #ff7ac8; color: var(--ink); }
.chip em.gold { background: var(--gold); color: var(--ink); }
.chip em.flank { background: #9b7bff; color: #fff; }
.chip.jump { outline: 2px dashed #ff9a4a; outline-offset: -2px; }
/* the clash: why each wheel is the way it is */
.whys { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; min-height: 20px; margin-top: 4px; }
.why { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 8px; background: rgba(255,255,255,.12); }
.why.flank, .why.boost { background: #4fd182; color: var(--ink); }
.why.cover, .why.brace { background: #7fd6ff; color: var(--ink); }
.why.chilled, .why.pinned { background: #ff9bb8; color: var(--ink); }
.lhelp { margin: 0 auto 8px; max-width: 320px; text-align: center; font-size: 12px; line-height: 1.35; color: var(--muted); }
/* the combo counter */
.combo { display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 10px rgba(255,122,200,.8); animation: comboIn 1.1s ease-out forwards; }
.combo b { font-size: 30px; }
.combo span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.combo.c3 b { font-size: 38px; color: #ffd166; } .combo.c4 b { font-size: 46px; color: #ff7ac8; }
@keyframes comboIn { 0% { transform: scale(.3); opacity: 0; } 15% { transform: scale(1.35); opacity: 1; } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-24px); opacity: 0; } }
.tag.purple { background: #9b7bff; }
.banner.big { font-size: 36px; padding: 18px 40px; }

/* ---------- r8 ---------- */
/* only buttons catch touches over the board, so a drag anywhere else always moves the camera */
.tray > * { pointer-events: none; }
.tray button, .tray .actions, .tray .hand, .tray .chips { pointer-events: auto; }
.coach { pointer-events: none; } .coach button { pointer-events: auto; }
.inspect { pointer-events: none; } .inspect button { pointer-events: auto; }
/* the HUD row: tighter pills so Boo, Glow and Alert fit on a phone */
.hud .row { gap: 6px; }
.pill { height: 36px; padding: 0 10px; gap: 5px; }
.pill.turn .lbl { display: none; } .pill.turn::before { content: 'T'; color: var(--muted); font-size: 13px; }
.pill.glow .pips { display: none; }
.pill.boo { margin-right: 0; border-color: rgba(183, 156, 255, .55); }
.pill.boo .ic { color: #efe6ff; font-size: 19px; } .pill.boo .lbl { display: none; }
.pill.boo .pips { display: flex; gap: 2px; } .pill.boo .pips i { width: 5px; height: 14px; border-radius: 3px; background: rgba(255,255,255,.15); }
.pill.boo .pips i.on { background: #c7a6ff; box-shadow: 0 0 6px rgba(199,166,255,.9); }
.pill.boo.low { border-color: var(--bad); } .pill.boo.low b { color: var(--bad); }
.pill.alert .ic { color: #ffb347; font-size: 17px; } .pill.alert.hot { border-color: #ff7a3c; color: #ffd0a8; }
.hud.huntmode .pill.boo, .hud.huntmode .pill.glow { opacity: .4; }
/* the aim banner: small, at the top, never in the way */
.aimbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--safe-t) + 96px); z-index: 12; width: min(360px, calc(100% - 70px)); display: flex; align-items: flex-start; gap: 8px;
  padding: 7px 8px 7px 10px; border-radius: 14px; background: rgba(36, 26, 70, .86); border: 1.5px solid rgba(255, 209, 102, .5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  pointer-events: none; animation: rise .18s; }
.aimbar .ab { flex: 1; min-width: 0; display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; align-items: center; }
.aimbar .ab > .ic { font-size: 22px; color: var(--gold); grid-row: span 2; }
.aimbar .at { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; } .aimbar .at b { font-size: 15px; } .aimbar .at span { font-size: 12px; color: var(--gold); }
.aimbar p { grid-column: 2; margin: 2px 0 0; font-size: 12px; line-height: 1.25; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.aimbar .x { pointer-events: auto; flex: none; width: 40px; height: 40px; margin: -4px -2px -4px 0; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.1); }
.ctx { padding: 6px; } .ctx .x { display: none; }
.go { height: 44px; }
/* actions: smaller discs, each with its Boo cost; the row scrolls if a ghost has a lot to do */
.actions { justify-content: safe center; overflow-x: auto; scrollbar-width: none; gap: 4px; min-height: 74px; }
.actions::-webkit-scrollbar { display: none; }
.act { flex: none; width: 56px; position: relative; }
.act .disc { width: 48px; height: 48px; font-size: 23px; }
.act > span:not(.ic) { font-size: 11px; max-width: 58px; }
.act .cost { position: absolute; top: -3px; left: 2px; display: flex; gap: 2px; padding: 2px 3px; border-radius: 7px; background: var(--ink); }
.act .cost i { width: 6px; height: 6px; border-radius: 50%; background: #c7a6ff; }
.act .cost.hunt i { background: #ff8a5a; }
.act .badge.cd { background: #2b3f66; }
.act.done { opacity: .5; }
/* the Hex Card hand */
.hand { display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; min-height: 0; }
.hand:empty { display: none; }
.hand .hl { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.hand .hl .ic { font-size: 16px; color: #c7a6ff; }
.hex { flex: none; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; background: linear-gradient(#4b3a8a, #33276a); border: 1.5px solid #8f78ff; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.hex.rare { border-color: var(--gold); background: linear-gradient(#5a4290, #3a2a6e); }
.hex.active { background: linear-gradient(#ffe08a, #ffbf3f); color: #4a2a00; border-color: #fff; }
.hex.off { opacity: .4; }
/* ghost cards: waiting in the jar, or in a possessed form */
.card.bench .face { filter: saturate(.6) brightness(.8); }
.card .out.jarwait { color: #b6ffcb; }
.card.formed { border-color: var(--gold); }
.endbtn.hunt { background: linear-gradient(#ffb36b, #ff7a3c); box-shadow: 0 4px 0 #a5481c; }
.huntpts { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 54px; border-radius: 14px; background: var(--panel); }
.huntpts b { font-size: 24px; color: #ff9a5a; } .huntpts span { font-size: 10px; color: var(--muted); }
.inspect .trait.brave { background: rgba(255,179,71,.16); color: #ffe0b5; }
/* floor tabs for a two-floor house */
.floors { position: absolute; right: 10px; top: calc(var(--safe-t) + 300px); display: flex; flex-direction: column; gap: 8px; }
.floors .fl b { font-size: 13px; }
.banner.card { background: linear-gradient(#5a4290, #3a2a6e); border-color: #8f78ff; }

/* ---------- screens: menu, picking, daily, ghosts ---------- */
.screen.title { gap: 14px; }
.rank { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 14px; background: var(--panel); font-size: 13px; }
.rank b { color: var(--gold); } .rank .rbar { width: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; } .rank .rbar i { display: block; height: 100%; background: var(--gold); }
.rank .ecto { display: inline-flex; align-items: center; gap: 3px; color: #b6ffcb; }
.row2 { display: flex; gap: 10px; }
.btn.dot { position: relative; } .btn.dot::after { content: ''; position: absolute; top: 6px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--ink); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.btn.off { opacity: .45; }
.screen.pick, .screen.daily, .screen.collection { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; gap: 10px; }
.link.back { align-self: flex-start; color: var(--muted); font-size: 16px; padding: 6px 0; }
.pickbody { width: min(440px, 100%); display: flex; flex-direction: column; gap: 8px; padding-bottom: 80px; }
.pickbody h3 { margin: 8px 0 0; font-size: 17px; } .pickbody h3 small { color: var(--muted); font-weight: 400; }
.houses { display: flex; gap: 8px; }
.hs { flex: 1; padding: 10px; border-radius: 14px; background: var(--panel); border: 2px solid transparent; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.hs b { font-size: 14px; } .hs span { font-size: 12px; color: var(--muted); }
.hs.on { border-color: var(--gold); } .hs.locked { opacity: .5; }
.gpick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.gp { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 14px; background: var(--panel); border: 2px solid transparent; }
.gp img { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 50%, #fff), var(--c)); border: 2px solid var(--ink); }
.gp b { font-size: 12px; } .gp span { font-size: 10px; color: var(--muted); } .gp em { font-style: normal; font-size: 10px; color: var(--gold); } .gp .sz { font-style: normal; font-size: 9px; color: #b6ffcb; }
.gp.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, var(--panel)); }
.note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.3; }
.cpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cp { padding: 8px; border-radius: 12px; background: var(--panel); border: 2px solid transparent; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.cp b { font-size: 13px; } .cp span { font-size: 11px; color: var(--muted); line-height: 1.25; }
.cp.rare b { color: var(--gold); } .cp.on { border-color: #8f78ff; background: rgba(143,120,255,.25); }
.seg { display: flex; gap: 6px; } .seg button { flex: 1; height: 42px; border-radius: 12px; background: var(--panel); font-weight: 600; } .seg button.on { background: #8f78ff; color: #fff; }
.btn.sticky { position: sticky; bottom: calc(var(--safe-b) + 8px); flex: none; }
.streak { display: flex; align-items: center; gap: 6px; color: #ffb8e0; } .streak .ic { color: #ff7ac8; }
.wheelwrap { position: relative; width: 240px; height: 240px; flex: none; }
.wheel { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--ink); overflow: hidden;
  background: conic-gradient(#5b3fa6 0 45deg, #ffd166 45deg 90deg, #4a3590 90deg 135deg, #7f5cd8 135deg 180deg, #5b3fa6 180deg 225deg, #ff9bd0 225deg 270deg, #4a3590 270deg 315deg, #7f5cd8 315deg 360deg); }
.wheel .sl { position: absolute; left: 50%; top: 0; height: 50%; width: 0; transform-origin: 50% 100%; transform: rotate(calc(var(--i) * 45deg + 22.5deg)); }
.wheel .sl span { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px var(--ink); }
.wheel .sl.rare span { color: var(--ink); text-shadow: none; }
.pointer { position: absolute; left: 50%; top: -10px; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #fff; filter: drop-shadow(0 2px 0 var(--ink)); }
.prize { margin: 0; min-height: 22px; font-weight: 600; color: var(--gold); }
.quests { width: min(360px, 100%); display: flex; flex-direction: column; gap: 6px; }
.q { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--panel); font-size: 14px; } .q b { color: var(--muted); } .q.done b { color: var(--good); }
.coll { width: min(440px, 100%); display: flex; flex-direction: column; gap: 8px; }
.gl { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--panel); border-left: 4px solid var(--c); }
.gl img { flex: none; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 50%, #fff), var(--c)); border: 2px solid var(--ink); }
.gl .gt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; } .gl .gt b { font-size: 15px; } .gl .gt span { font-size: 11px; color: var(--muted); line-height: 1.25; }
.gl .dim { color: #8b80b8 !important; } .gl .max { color: var(--gold); }
.chip2 { align-self: flex-start; font-size: 12px; padding: 4px 10px; border-radius: 10px; background: rgba(255,209,102,.18); color: var(--gold); }
.screen.pass { background: rgba(18,14,51,.97); } .screen.pass p { color: var(--muted); margin: 0; }
.screen.pass.hunters h2 { color: #ffb36b; }
.recap { width: min(340px, 100%); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.recap .rr { display: flex; flex-direction: column; align-items: center; padding: 8px 14px; border-radius: 12px; background: var(--panel); } .recap .rr b { font-size: 22px; color: var(--gold); } .recap .rr span { font-size: 11px; color: var(--muted); }

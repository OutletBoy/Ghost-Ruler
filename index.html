<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost Ruler: pick a version</title>
<style>
  :root{--ink:#2b2340;--paper:#fffaf0;--shadow:0 5px 0 rgba(43,35,64,.85);font-family:"Trebuchet MS","Segoe UI","Nunito",system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{color:var(--ink);background:#2d2a5a;
    background:
      radial-gradient(circle at 85% 8%, #fff7c2 0 26px, #fff7c240 27px 40px, transparent 41px),
      radial-gradient(2px 2px at 12% 14%, #fff 99%, transparent),
      radial-gradient(2px 2px at 30% 6%, #fff 99%, transparent),
      radial-gradient(2px 2px at 55% 18%, #fff 99%, transparent),
      radial-gradient(2px 2px at 8% 40%, #fff 99%, transparent),
      radial-gradient(2px 2px at 92% 35%, #fff 99%, transparent),
      linear-gradient(#2d2a5a, #5a3f86);
    background-attachment:fixed}
  main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
  .hero{text-align:center;color:#fff}
  .hero svg{width:96px;height:104px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:float 2.4s ease-in-out infinite}
  .hero h1{margin:6px 0 4px;font-size:40px;text-shadow:0 4px 0 var(--ink);letter-spacing:1px}
  .hero p{margin:0 0 20px;font-weight:700;opacity:.9}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
  a.ver{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--paper);
        border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;transition:transform .12s}
  a.ver:hover,a.ver:focus-visible{transform:translateY(-3px) rotate(-.5deg);outline:none;background:#fff3c4}
  a.ver:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
  .tag{flex:none;font-weight:900;font-size:18px;background:#ffd166;border:3px solid var(--ink);border-radius:12px;padding:4px 10px}
  .info{flex:1;min-width:0}
  .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:900}
  .new{font-size:11px;background:#ff7aa2;color:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px}
  .date{font-size:13px;font-weight:700;opacity:.7}
  .what{font-weight:600;margin-top:2px}
  .play{flex:none;font-weight:900;background:#7ee081;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 var(--ink)}
  footer{margin-top:24px;color:#fff;opacity:.75;text-align:center;font-size:13px;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="hero">
    <svg viewBox="0 0 60 66" aria-hidden="true">
      <path d="M10 34 C10 16 20 8 30 8 C40 8 50 16 50 34 L50 58 Q45 64 40 58 Q35 52 30 58 Q25 64 20 58 Q15 52 10 58 Z" fill="#cdbcff" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/>
      <path d="M30 2 C24 10 25 15 30 17 C35 15 36 10 30 2Z" fill="#ffb020" stroke="#2b2340" stroke-width="2.5"/>
      <ellipse cx="23" cy="30" rx="4" ry="5.5" fill="#2b2340"/><ellipse cx="37" cy="30" rx="4" ry="5.5" fill="#2b2340"/>
      <circle cx="24.3" cy="28" r="1.5" fill="#fff"/><circle cx="38.3" cy="28" r="1.5" fill="#fff"/>
      <ellipse cx="18" cy="37" rx="3" ry="2" fill="#ff9bb5"/><ellipse cx="42" cy="37" rx="3" ry="2" fill="#ff9bb5"/>
      <ellipse cx="30" cy="38" rx="3" ry="3.6" fill="#2b2340"/>
    </svg>
    <h1>Ghost Ruler</h1>
    <p>Pick a version to play. Newest is on top.</p>
  </div>

  <ul id="list"></ul>
  <noscript><p style="color:#fff">Scripts are off. Open a version directly: <a style="color:#ffd166" href="versions/ghost-ruler-r1.html">r1</a></p></noscript>

  <footer>Every version stays playable here, so you can compare old and new.</footer>
</main>

<script>
// ===== Version list: to add a version, put one new line at the TOP. =====
// file is relative to this page, so it works on any host or sub-folder.
const VERSIONS = [
  { id: 'r1', date: '2026-11-25', file: 'versions/ghost-ruler-r1.html', what: 'First playable house: 3 ghosts, 4 people, Belief, weak spots, screams that spread.' },
];
// ========================================================================

const list = document.getElementById('list');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
VERSIONS.forEach((v, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a class="ver" href="${esc(v.file)}">
      <span class="tag">${esc(v.id)}</span>
      <span class="info"><span class="top">${i === 0 ? '<span class="new">Newest</span>' : ''}<span class="date">${esc(v.date)}</span></span>
      <span class="what">${esc(v.what)}</span></span>
      <span class="play">Play</span></a>`;
  list.appendChild(li);
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost Ruler: pick a version</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#241a3f;--gold:#ffd166;--pink:#ff7aa2;--mint:#7ee0a8;--glass:rgba(34,24,72,.62);--line:rgba(255,255,255,.16);
        font-family:"Nunito",system-ui,sans-serif;color:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#14103a;
    background:
      radial-gradient(circle at 84% 9%, #fff3c4 0 30px, rgba(255,243,196,.22) 31px 52px, transparent 53px),
      radial-gradient(2px 2px at 12% 14%, #fff 99%, transparent), radial-gradient(2px 2px at 30% 6%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 55% 18%, #fff 99%, transparent), radial-gradient(2px 2px at 8% 40%, #fff 99%, transparent),
      radial-gradient(1.5px 1.5px at 92% 35%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 70% 28%, #fff 99%, transparent),
      linear-gradient(#14103a 0%, #2e2168 55%, #6a3f8c 100%);
    background-attachment:fixed}
  main{max-width:640px;margin:0 auto;padding:28px 16px 40px}
  .hero{text-align:center}
  .hero svg{width:92px;height:100px;filter:drop-shadow(0 10px 18px rgba(169,139,255,.55));animation:float 2.6s ease-in-out infinite}
  .hero h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;margin:6px 0 4px;font-size:46px;letter-spacing:.5px;text-shadow:0 4px 0 var(--ink)}
  .hero p{margin:0 0 22px;font-weight:700;opacity:.85}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
  a.ver{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--glass);
        border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .14s, background .14s, border-color .14s}
  a.ver:hover,a.ver:focus-visible{transform:translateY(-3px);background:rgba(60,42,120,.72);border-color:rgba(255,209,102,.6);outline:none}
  a.ver:active{transform:translateY(1px)}
  .tag{flex:none;font-family:"Fredoka",sans-serif;font-weight:700;font-size:18px;color:var(--ink);background:var(--gold);border-radius:12px;padding:5px 11px}
  .info{flex:1;min-width:0}
  .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
  .new{font-size:11px;background:var(--pink);color:#fff;border-radius:999px;padding:1px 9px;letter-spacing:.3px}
  .date{font-size:13px;font-weight:700;opacity:.65}
  .what{font-weight:700;margin-top:3px;line-height:1.35;opacity:.95}
  .play{flex:none;font-family:"Fredoka",sans-serif;font-weight:600;color:var(--ink);background:var(--mint);border-radius:12px;padding:7px 14px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  footer{margin-top:26px;opacity:.65;text-align:center;font-size:13px;font-weight:700}
  @media (max-width:420px){ .hero h1{font-size:38px} a.ver{gap:10px;padding:12px} .play{padding:6px 10px} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="hero">
    <svg viewBox="0 0 60 66" aria-hidden="true">
      <path d="M10 34 C10 16 20 8 30 8 C40 8 50 16 50 34 L50 58 Q45 64 40 58 Q35 52 30 58 Q25 64 20 58 Q15 52 10 58 Z" fill="#b7a0ff" stroke="#241a3f" stroke-width="3" stroke-linejoin="round"/>
      <path d="M30 2 C24 10 25 15 30 17 C35 15 36 10 30 2Z" fill="#ffa62b" stroke="#241a3f" stroke-width="2.5"/>
      <ellipse cx="23" cy="30" rx="4" ry="5.5" fill="#241a3f"/><ellipse cx="37" cy="30" rx="4" ry="5.5" fill="#241a3f"/>
      <circle cx="24.3" cy="28" r="1.5" fill="#fff"/><circle cx="38.3" cy="28" r="1.5" fill="#fff"/>
      <ellipse cx="18" cy="37" rx="3" ry="2" fill="#ff9bb5"/><ellipse cx="42" cy="37" rx="3" ry="2" fill="#ff9bb5"/>
      <ellipse cx="30" cy="38" rx="3" ry="3.6" fill="#241a3f"/>
    </svg>
    <h1>Ghost Ruler</h1>
    <p>Pick a version to play. Newest is on top.</p>
  </div>

  <ul id="list"></ul>
  <noscript><p>Scripts are off. Open a version directly: <a style="color:#ffd166" href="versions/ghost-ruler-r12.2.html">r12.2</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r12.1.html">r12.1</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r12.html">r12</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r11.html">r11</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r10.html">r10</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r9.html">r9</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r8.html">r8</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r7.html">r7</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r6.html">r6</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r4.html">r4</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r3.html">r3</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r2.html">r2</a>, <a style="color:#ffd166" href="versions/ghost-ruler-r1.html">r1</a></p></noscript>

  <footer>Every version stays playable here, so you can compare old and new.</footer>
</main>

<script>
// ===== Version list: to add a version, put one new line at the TOP. =====
// file is relative to this page, so it works on any host or sub-folder.
const VERSIONS = [
  { id: 'r12.2', date: '2026-11-27', file: 'versions/ghost-ruler-r12.2.html', what: 'Fairer and longer games. To step onto the enemy base, a piece must start its turn right next to it, so you always get a warning. Patches and Nell shield the teammates next to them (hits do 1 less). A piece shoved into a wall or another piece takes 1 more. Lint\'s Dust Devil now matches Gus\'s Vacuum. Hunters need 5 catches, and people are a little braver, so most games last 12 to 20 rounds.' },
  { id: 'r12.1', date: '2026-11-27', file: 'versions/ghost-ruler-r12.1.html', what: 'Fair from the first turn. A wheel spins to pick who goes first, and the side that goes second gets 1 extra card. Each side has 2 entry spots in its back corners, and your own entry spot is safe. Pick 4 of your 5 pieces; at most 3 are on the board, the rest wait on the bench. Hunters can squeeze past people, a caught ghost leaves a lit spot, and ghosts can win by clearing the board. Reaching the enemy base wins only if your piece is still there at the start of your next turn. Tap an entry spot once to see where you could go. The board is mirrored, so both sides get the same house.' },
  { id: 'r12', date: '2026-11-27', file: 'versions/ghost-ruler-r12.html', what: 'Fairer rules. Coming in uses 1 step, and a piece can\'t step on a base the turn it comes in, so no more one-turn wins. Ghosts can float through people (2 steps, 3 for two in a row) and people can box a ghost in. New goals: ghosts scare everyone out or reach the trap box; hunters catch 4 ghosts, reach the spirit board, or catch the last ghost on the board. A person who runs out leaves a haunted spot. Cards cost what they show (1 more for a step card near the enemy base, 1 less when you are 2 behind), bonuses cap at +3, a free hand swap on turn 1, and a late-night clock from round 20. In 2 players the warnings are off unless you turn them on. The turn ends by itself when nothing is left to do.' },
  { id: 'r11', date: '2026-11-27', file: 'versions/ghost-ruler-r11.html', what: 'Every attack and card now says what it does on its face, with its cost or rest. Tap one to read every tag in plain words, see the range and exactly what will happen, then tap again or Play. Your Boo sits beside your cards and shows what a card will leave you with; anything you can\'t use says why. Four roles on both sides (Close-range, Ranged, All-round, Support), and some cards do a bit more on their role. Tap an enemy to see its attacks and who it can hit next turn.' },
  { id: 'r10', date: '2026-11-26', file: 'versions/ghost-ruler-r10.html', what: 'Each ghost and hunter now has its own attacks, and cards are a hand of up to 3 special items (snacks, power-ups, a room-wide scare) that go back in the deck when used. Team combos, slow-motion finishers, people fleeing, and 3 stars per night. Far less text: icons, numbers and one tip line. Camera: drag to pan, pinch to zoom, hold one finger and swipe the other (or twist) to turn. A darker, creepier house with flickering lamps, fog, cobwebs and glowing ghosts.' },
  { id: 'r9', date: '2026-11-26', file: 'versions/ghost-ruler-r9.html', what: 'The fresh start: one goal always on screen, tap a ghost to see glowing moves and a preview of exactly what happens. Six short nights, each adds one idea. Pokémon-card style move cards with cost, power, range and uses. Ghosts and hunters come in one a turn, up to 3 each. Win by reaching the trap box or with 3 knockouts; hunters win at your spirit board. Smoother camera with turn and reset buttons, and 2 players on one phone.' },
  { id: 'r8', date: '2026-11-26', file: 'versions/ghost-ruler-r8.html', what: 'The big update: pick 3 of 5 ghosts and 4 Hex Cards, spend Boo on every move, bring ghosts out of the jar one a turn, Pin hunters with two ghosts, barricade doors, set ambushes and possess props. Families and hunters fight back. A 2-floor second house, 2 players on one phone, ranks, ghost levels, a daily spin and quests. Update: two ghosts start out, more Boo, a Hint button that lights the best move, and a new guide.' },
  { id: 'r7', date: '2026-11-26', file: 'versions/ghost-ruler-r7.html', what: 'The fun update: all 3 ghosts move and act every turn, slip through people, hitch rides and phase through thin walls. Two ways to win: scare the family out or hold the grandfather clock. Grabbers, a lantern and a guard come in one a turn. Signature moves and combos.' },
  { id: 'r6', date: '2026-11-26', file: 'versions/ghost-ruler-r6.html', what: 'Turn-based remake, house 1: place Patches, Wick and Rime, then take turns with the house. Weak spots, ghost duets, clash wheels against hunters, box hunters in, and ghosts that come back after a wait. Built for phones.' },
  { id: 'r4', date: '2026-11-26', file: 'versions/ghost-ruler-r4.html', what: 'Less text, more house: an icon scare wheel, slimmer ghost cards, short tips that fade on their own, and a ? button for help.' },
  { id: 'r3', date: '2026-11-25', file: 'versions/ghost-ruler-r3.html', what: 'Strategy nights: scout the family, plan your ghosts, then haunt. Top-down camera you can pan, pinch and turn, a scare wheel, combos and chains, plus a dog and a skeptic to work around.' },
  { id: 'r2', date: '2026-11-25', file: 'versions/ghost-ruler-r2.html', what: 'Real 3D dollhouse you can spin and zoom, cartoon lighting, scare effects, sounds, a guided first night and menus.' },
  { id: 'r1', date: '2026-11-25', file: 'versions/ghost-ruler-r1.html', what: 'First playable house (flat 2D): 3 ghosts, 4 people, Belief, weak spots, screams that spread.' },
];
// ========================================================================

const list = document.getElementById('list');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
VERSIONS.forEach((v, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a class="ver" href="${esc(v.file)}">
      <span class="tag">${esc(v.id)}</span>
      <span class="info"><span class="top">${i === 0 ? '<span class="new">Newest</span>' : ''}<span class="date">${esc(v.date)}</span></span>
      <span class="what">${esc(v.what)}</span></span>
      <span class="play">Play</span></a>`;
  list.appendChild(li);
});
</script>
</body>
</html>
